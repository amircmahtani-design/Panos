<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16A3A0">
<title>Studio · Papantoniou</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#16A3A0;--teal-dk:#0E8B88;--ink:#16303B;--soft:#5C7480;--line:#DCE9ED;
 --bg:#F2F9FB;--gold:#C9A45C;--warn:#B4553F;--bar:64px}
*,*::before,*::after{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
 font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Cormorant Garamond',serif;margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;font-size:13px}
input,textarea,select{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;
 border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;
 border-radius:9px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--teal);color:var(--teal-dk)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger:hover{border-color:var(--warn);color:var(--warn)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;
 justify-content:center;z-index:100;padding:22px}
#gate .box{background:#fff;border-radius:16px;padding:34px 26px;max-width:340px;width:100%;text-align:center}
#gate h1{font-size:26px;margin-bottom:4px}
#gate p{color:var(--soft);font-size:13px;margin:0 0 20px}
#gate input{text-align:center;margin-bottom:12px}
#gate button{width:100%;background:var(--teal);color:#fff;border:0;padding:14px;border-radius:9px;font-weight:600}
#gate .err{color:var(--warn);font-size:12.5px;min-height:18px;margin-top:8px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1100px;margin:0 auto}
.hrow .title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;flex:none}
.hrow .sp{flex:1}
.badge{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
 border:1px solid var(--gold);padding:3px 7px;border-radius:99px;white-space:nowrap}
.lang{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;flex:none}
.lang button{background:none;border:0;color:#9BB0B8;padding:5px 6px;border-radius:6px}
.lang button.on{color:#fff;background:var(--teal)}
.acts{display:flex;gap:8px;padding:0 14px 10px;max-width:1100px;margin:0 auto}
.acts .btn{flex:1;text-align:center;font-size:12px;padding:10px 6px}

/* ---------- nav ---------- */
.navwrap{padding:0 14px 10px;max-width:1100px;margin:0 auto}
.navwrap select{font-weight:600}
nav.side{display:none}

/* ---------- main ---------- */
main{padding:18px 14px calc(var(--bar) + 30px);max-width:1100px;margin:0 auto}
main h2{font-size:24px;margin-bottom:3px}
main .sub{color:var(--soft);font-size:12.5px;margin-bottom:20px;line-height:1.55}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:2px}
.card .k{font-size:10px;color:#9BB0B8;font-family:ui-monospace,monospace;margin-bottom:10px;word-break:break-all}
.fld label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
 color:#9BB0B8;font-weight:700;margin-bottom:5px}
.fld+.fld{margin-top:12px}
.row{display:grid;gap:12px}
.hint{font-size:11.5px;color:#9BB0B8;margin-top:8px;line-height:1.5}
.flag{font-size:12.5px}

/* translate pair */
.trrow{display:grid;gap:10px}
.trbox{display:flex;gap:8px}
.trbtn{flex:1;border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:8px;
 padding:9px 6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;transition:.2s}
.trbtn:hover{border-color:var(--teal);color:var(--teal-dk);background:#F2FAFA}
.trbtn:disabled{opacity:.5}
.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;
 border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:12px;
 font-size:12px;color:var(--soft)}
.bulkbar .btn{padding:8px 12px;font-size:11.5px}
.search{margin-bottom:14px}

/* hours */
.hrow2{border-bottom:1px dashed var(--line);padding:12px 0}
.hrow2:last-child{border-bottom:0}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hcl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);margin-top:8px}
.hcl input{width:auto}

/* images / team */
.imgcard{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.prev{width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--bg);
 border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.prev img{width:100%;height:100%;object-fit:cover}
.prev span{font-size:10px;color:#9BB0B8;text-align:center;padding:4px}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:#fff;
 padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.savebar .msg{flex:1;font-size:11.5px;color:rgba(255,255,255,.72);line-height:1.35;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.savebar .btn{background:transparent;border-color:rgba(255,255,255,.3);color:#fff;font-size:11.5px;padding:9px 12px}
.savebar .btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* ---------- desktop ---------- */
@media (min-width:821px){
  .hrow{padding:12px 20px}
  .hrow .title{font-size:21px}
  .acts{padding:0 20px 12px;justify-content:flex-end}
  .acts .btn{flex:none;font-size:13px;padding:10px 16px}
  .navwrap{display:none}
  .shell{display:grid;grid-template-columns:230px 1fr;max-width:1180px;margin:0 auto;
    min-height:calc(100vh - 120px)}
  nav.side{display:block;background:#fff;border-right:1px solid var(--line);padding:16px 12px}
  nav.side button{display:block;width:100%;text-align:left;background:none;border:0;
    padding:10px 12px;border-radius:8px;color:var(--soft);font-weight:600;font-size:13px}
  nav.side button:hover{background:var(--bg);color:var(--ink)}
  nav.side button.on{background:var(--teal);color:#fff}
  nav.side .grp{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#9BB0B8;padding:16px 12px 6px}
  main{padding:26px 28px 90px;max-width:none}
  main h2{font-size:27px}
  .card{padding:20px}
  .row{grid-template-columns:1fr 1fr;gap:14px}
  .fld+.fld{margin-top:0}
  .trrow{grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
  .trbox{flex-direction:column;gap:6px;padding-bottom:2px}
  .trbtn{min-width:84px}
  .hgrid{grid-template-columns:1.1fr 1.1fr 1fr auto;align-items:center}
  .hcl{margin-top:0}
  .imgcard{grid-template-columns:120px 1fr;gap:16px}
  .prev{width:120px;height:120px}
  input,textarea,select{font-size:13.5px}
  .savebar{padding:12px 20px}
  .savebar .msg{font-size:12.5px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Studio</h1>
    <p>Papantoniou</p>
    <input type="password" id="pw" autocomplete="current-password">
    <button id="go"></button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hrow">
      <span class="title">Studio</span>
      <span class="badge" id="dirty" hidden></span>
      <span class="sp"></span>
      <span class="lang">
        <button data-ui="el">EL</button><button data-ui="en">EN</button>
      </span>
    </div>
    <div class="acts">
      <a class="btn" id="viewSite" href="../index.html" target="_blank" rel="noopener"></a>
      <button class="btn" id="importBtn"></button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn primary" id="exportBtn"></button>
    </div>
    <div class="navwrap"><select id="navSel"></select></div>
  </header>

  <div class="shell">
    <nav class="side" id="nav"></nav>
    <main id="view"></main>
  </div>

  <div class="savebar">
    <span class="msg" id="msg"></span>
    <button class="btn" id="resetBtn"></button>
    <button class="btn primary" id="exportBtn2"></button>
  </div>
</div>

<script>
/* =====================================================================
   Studio — edits a working copy of content.json in this browser,
   then exports a new content.json to upload to GitHub.
   The password is a convenience latch, not real security.
   ===================================================================== */
const PASSWORD = "panos";                 // change me
const LSKEY    = "papantoniou_studio_v1";
const UIKEY    = "papantoniou_studio_ui";
const TR_EMAIL_KEY = "papantoniou_studio_email";

/* ---------- interface language ---------- */
const UI = {
 el:{
  pw:"Κωδικός", go:"Είσοδος", wrong:"Λάθος κωδικός.",
  unsaved:"μη αποθηκευμένο", view:"Site", imp:"Εισαγωγή", exp:"Εξαγωγή", reset:"Επαναφορά",
  idle:"Οι αλλαγές αποθηκεύονται τοπικά σε αυτόν τον browser.",
  dirtyMsg:"Μη εξαγόμενες αλλαγές — πατήστε Εξαγωγή όταν τελειώσετε.",
  exported:"Έγινε εξαγωγή. Ανεβάστε το content.json στο GitHub.",
  imported:"Έγινε εισαγωγή αρχείου.", restored:"Έγινε επαναφορά.",
  loadedLocal:"Φορτώθηκε τοπικό αντίγραφο με μη εξαγόμενες αλλαγές.",
  gSettings:"Ρυθμίσεις", gTexts:"Κείμενα",
  brand:"Λογότυπο & μάρκα", contact:"Στοιχεία επικοινωνίας", hours:"Ωράριο",
  team:"Η ομάδα", treatments:"Θεραπείες", faq:"Συχνές ερωτήσεις", images:"Φωτογραφίες",
  brandSub:"Το όνομα στην κεφαλίδα αλλάζει από τα Κείμενα → Κοινά.",
  ownLogo:"Δικό σας λογότυπο", upload:"Ανέβασμα εικόνας", remove:"Αφαίρεση",
  useLogo:"Χρήση δικού μου λογότυπου αντί του σχεδιασμένου",
  logoHint:"Προτείνεται PNG με διαφάνεια, τετράγωνο, τουλάχιστον 200×200.",
  contactSub:"Αλλάζουν παντού στο site ταυτόχρονα.",
  trEmail:"Email για μεγαλύτερο όριο μεταφράσεων (προαιρετικό)",
  trAddr:"μεταφράζει τη διεύθυνση",
  hoursSub:"Εμφανίζεται στη σελίδα Επικοινωνίας.",
  dayEl:"Ημέρα (EL)", dayEn:"Day (EN)", closed:"κλειστά",
  teamSub:"Φωτογραφία τύπου βιογραφικού και σύντομο κείμενο για κάθε μέλος.",
  addMember:"+ Νέο μέλος", delMember:"Διαγραφή μέλους", photo:"Φωτογραφία",
  delPhoto:"Αφαίρεση φωτό", noPhoto:"χωρίς φωτό", noFile:"χωρίς αρχείο",
  nameEl:"Όνομα (EL)", nameEn:"Name (EN)", roleEl:"Ιδιότητα (EL)", roleEn:"Role (EN)",
  bioEl:"Βιογραφικό (EL)", bioEn:"Biography (EN)",
  photoHint:"Η φωτογραφία μικραίνει αυτόματα σε 700px.",
  treatSub:"Τίτλος, σύντομη περιγραφή και αναλυτικό κείμενο. Κενή γραμμή = νέα παράγραφος.",
  addTreat:"+ Νέα θεραπεία", delTreat:"Διαγραφή θεραπείας",
  titleEl:"Τίτλος (EL)", titleEn:"Title (EN)", shortEl:"Σύντομη (EL)", shortEn:"Short (EN)",
  detailEl:"Αναλυτικά (EL)", detailEn:"Detail (EN)", icon:"Εικονίδιο",
  faqSub:"Εμφανίζονται στη σελίδα Συχνών Ερωτήσεων, ομαδοποιημένες κατά κατηγορία.",
  catEl:"Κατηγορία (EL)", catEn:"Category (EN)",
  catHint:"Ερωτήσεις με την ίδια κατηγορία εμφανίζονται μαζί, με τη σειρά που τις βλέπετε εδώ.",
  addFaq:"+ Νέα ερώτηση", delFaq:"Διαγραφή ερώτησης",
  qEl:"Ερώτηση (EL)", qEn:"Question (EN)", aEl:"Απάντηση (EL)", aEn:"Answer (EN)",
  imgSub:"Αντικαταστήστε οποιαδήποτε φωτογραφία του site.",
  replace:"Αντικατάσταση", restore:"Επαναφορά", imgHint:"Μικραίνει αυτόματα σε 1600px.",
  strSub:n=>n+" κείμενα. Γράψτε σε όποια γλώσσα θέλετε και πατήστε το βέλος για μετάφραση.",
  fillBlank:"Συμπλήρωση κενών:", searchPh:"Αναζήτηση κειμένου…",
  greek:"Ελληνικά", english:"English",
  trDone:d=>"Μετάφραση "+d+" ολοκληρώθηκε.",
  trEmptySrc:"Η γλώσσα προέλευσης είναι κενή.",
  trFail:"Η μετάφραση απέτυχε (χωρίς σύνδεση ή όριο υπηρεσίας). Το πεδίο δεν άλλαξε.",
  trBusy:"Μετάφραση σε εξέλιξη…",
  trBulk:(d,f)=>d+" κείμενα μεταφράστηκαν"+(f?", "+f+" απέτυχαν":"")+".",
  confDelMember:"Διαγραφή αυτού του μέλους;", confDelTreat:"Διαγραφή αυτής της θεραπείας;",
  confDelFaq:"Διαγραφή αυτής της ερώτησης;",
  confReset:"Επαναφορά όλων στο δημοσιευμένο content.json; Οι τοπικές αλλαγές θα χαθούν.",
  badJson:"Μη έγκυρο JSON.",
  groups:{"Αρχική":"Αρχική","Επικοινωνία":"Επικοινωνία","Ευχαριστούμε":"Ευχαριστούμε",
    "Η ομάδα":"Η ομάδα","Κοινά (header / footer / κουμπιά)":"Κοινά (header / footer)",
    "Σελίδα 404":"Σελίδα 404","Το ιατρείο":"Το ιατρείο","Υπηρεσίες":"Υπηρεσίες"}
 },
 en:{
  pw:"Password", go:"Enter", wrong:"Wrong password.",
  unsaved:"unsaved", view:"Site", imp:"Import", exp:"Export", reset:"Reset",
  idle:"Changes are saved locally in this browser.",
  dirtyMsg:"Unexported changes — press Export when you are done.",
  exported:"Exported. Upload content.json to GitHub.",
  imported:"File imported.", restored:"Restored.",
  loadedLocal:"Loaded a local copy with unexported changes.",
  gSettings:"Settings", gTexts:"Texts",
  brand:"Logo & brand", contact:"Contact details", hours:"Opening hours",
  team:"Team", treatments:"Treatments", faq:"FAQ", images:"Photos",
  brandSub:"The name in the header is edited under Texts → Common.",
  ownLogo:"Your own logo", upload:"Upload image", remove:"Remove",
  useLogo:"Use my logo instead of the drawn one",
  logoHint:"A square PNG with transparency, at least 200×200, works best.",
  contactSub:"These change everywhere on the site at once.",
  trEmail:"Email for a higher translation limit (optional)",
  trAddr:"translates the address",
  hoursSub:"Shown on the Contact page.",
  dayEl:"Day (EL)", dayEn:"Day (EN)", closed:"closed",
  teamSub:"A CV-style photo and a short text for each member.",
  addMember:"+ New member", delMember:"Delete member", photo:"Photo",
  delPhoto:"Remove photo", noPhoto:"no photo", noFile:"no file",
  nameEl:"Name (EL)", nameEn:"Name (EN)", roleEl:"Role (EL)", roleEn:"Role (EN)",
  bioEl:"Biography (EL)", bioEn:"Biography (EN)",
  photoHint:"The photo is resized automatically to 700px.",
  treatSub:"Title, short description and full text. A blank line starts a new paragraph.",
  addTreat:"+ New treatment", delTreat:"Delete treatment",
  titleEl:"Title (EL)", titleEn:"Title (EN)", shortEl:"Short (EL)", shortEn:"Short (EN)",
  detailEl:"Detail (EL)", detailEn:"Detail (EN)", icon:"Icon",
  faqSub:"Shown on the FAQ page, grouped by category.",
  catEl:"Category (EL)", catEn:"Category (EN)",
  catHint:"Questions sharing a category appear together, in the order you see them here.",
  addFaq:"+ New question", delFaq:"Delete question",
  qEl:"Question (EL)", qEn:"Question (EN)", aEl:"Answer (EL)", aEn:"Answer (EN)",
  imgSub:"Replace any photo on the site.",
  replace:"Replace", restore:"Restore", imgHint:"Resized automatically to 1600px.",
  strSub:n=>n+" texts. Write in whichever language you prefer and press the arrow to translate.",
  fillBlank:"Fill blanks:", searchPh:"Search text…",
  greek:"Greek", english:"English",
  trDone:d=>"Translation "+d+" complete.",
  trEmptySrc:"The source language is empty.",
  trFail:"Translation failed (offline or service limit). The field was left unchanged.",
  trBusy:"Translating…",
  trBulk:(d,f)=>d+" texts translated"+(f?", "+f+" failed":"")+".",
  confDelMember:"Delete this member?", confDelTreat:"Delete this treatment?",
  confDelFaq:"Delete this question?",
  confReset:"Reset everything to the published content.json? Local changes will be lost.",
  badJson:"Invalid JSON.",
  groups:{"Αρχική":"Home","Επικοινωνία":"Contact","Ευχαριστούμε":"Thank you",
    "Η ομάδα":"Team","Κοινά (header / footer / κουμπιά)":"Common (header / footer)",
    "Σελίδα 404":"404 page","Το ιατρείο":"The clinic","Υπηρεσίες":"Treatments"}
 }
};

let ui = localStorage.getItem(UIKEY) === "en" ? "en" : "el";
const T = k => UI[ui][k];
const G = g => (UI[ui].groups[g] || g);

let DATA=null, BASE=null, dirty=false, tab="brand";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ---------- gate ---------- */
function paintGate(){
  $("#pw").placeholder = T("pw");
  $("#go").textContent = T("go");
}
paintGate();
$("#go").onclick = tryEnter;
$("#pw").onkeydown = e => { if (e.key === "Enter") tryEnter(); };
function tryEnter(){
  if ($("#pw").value === PASSWORD){ sessionStorage.setItem("studio_ok","1"); enter(); }
  else $("#err").textContent = T("wrong");
}
if (sessionStorage.getItem("studio_ok") === "1") enter();

function enter(){
  const g = $("#gate"); if (g) g.style.display = "none";
  $("#app").hidden = false;
  load();
}

/* ---------- data ---------- */
async function load(){
  const res = await fetch("../content.json", {cache:"no-store"});
  BASE = await res.json();
  const saved = localStorage.getItem(LSKEY);
  DATA = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(BASE));
  paintChrome();
  if (saved) setDirty(true, T("loadedLocal"));
  buildNav(); render();
}
function persist(){ localStorage.setItem(LSKEY, JSON.stringify(DATA)); setDirty(true); }
function setDirty(v,m){
  dirty=v; $("#dirty").hidden=!v; $("#dirty").textContent=T("unsaved");
  $("#msg").textContent = m || (v ? T("dirtyMsg") : T("idle"));
}
function flash(m){ $("#msg").textContent = m; }

/* ---------- chrome ---------- */
function paintChrome(){
  document.documentElement.lang = ui;
  $("#viewSite").textContent = T("view");
  $("#importBtn").textContent = T("imp");
  $("#exportBtn").textContent = T("exp");
  $("#exportBtn2").textContent = T("exp");
  $("#resetBtn").textContent = T("reset");
  $("#dirty").textContent = T("unsaved");
  if (!dirty) $("#msg").textContent = T("idle");
  document.querySelectorAll(".lang button").forEach(b =>
    b.classList.toggle("on", b.dataset.ui === ui));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  ui = b.dataset.ui; localStorage.setItem(UIKEY, ui);
  paintGate(); paintChrome(); buildNav(); render();
});

/* ---------- nav ---------- */
const TABS = [
  ["brand","brand"],["contact","contact"],["hours","hours"],
  ["team","team"],["treatments","treatments"],["faq","faq"],["images","images"]
];
function groups(){
  return [...new Set(Object.values(DATA.strings).map(v => v.group || "Άλλα"))].sort();
}
function buildNav(){
  let side = `<div class="grp">${esc(T("gSettings"))}</div>`;
  TABS.forEach(([id,k]) => side += `<button data-t="${id}" class="${tab===id?"on":""}">${esc(T(k))}</button>`);
  side += `<div class="grp">${esc(T("gTexts"))}</div>`;
  groups().forEach(g => side += `<button data-t="g:${esc(g)}" class="${tab==="g:"+g?"on":""}">${esc(G(g))}</button>`);
  $("#nav").innerHTML = side;
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.t));

  let sel = `<optgroup label="${esc(T("gSettings"))}">`;
  TABS.forEach(([id,k]) => sel += `<option value="${id}" ${tab===id?"selected":""}>${esc(T(k))}</option>`);
  sel += `</optgroup><optgroup label="${esc(T("gTexts"))}">`;
  groups().forEach(g => sel += `<option value="g:${esc(g)}" ${tab==="g:"+g?"selected":""}>${esc(G(g))}</option>`);
  sel += "</optgroup>";
  $("#navSel").innerHTML = sel;
  $("#navSel").onchange = e => go(e.target.value);
}
function go(t){ tab=t; buildNav(); render(); window.scrollTo(0,0); }

/* ---------- render ---------- */
function render(){
  const v = $("#view");
  if (tab==="brand")      { v.innerHTML=viewBrand();   bindBrand(); }
  else if (tab==="contact"){ v.innerHTML=viewContact(); bindContact(); }

/* ---------- translation ---------- */
async function translateText(text,from,to){
  text=(text||"").trim(); if(!text) return "";
  const email=localStorage.getItem(TR_EMAIL_KEY)||"";
  try{
    const u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+
            "&langpair="+from+"|"+to+(email?"&de="+encodeURIComponent(email):"");
    const j=await (await fetch(u)).json();
    const out=j&&j.responseData&&j.responseData.translatedText;
    if(out&&!/^MYMEMORY WARNING/i.test(out)&&!/QUERY LENGTH LIMIT/i.test(out))
      return out.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&");
  }catch(_){}
  try{
    const j=await (await fetch("https://lingva.ml/api/v1/"+from+"/"+to+"/"+encodeURIComponent(text))).json();
    if(j&&j.translation) return j.translation;
  }catch(_){}
  throw new Error("no-provider");
}
function trPair(key){
  if(key.startsWith("strings:")){const k=key.slice(8);
    return {get:l=>DATA.strings[k][l],set:(l,v)=>{DATA.strings[k][l]=v;}};}
  if(key.startsWith("team:")){const[,i,p]=key.split(":");
    return {get:l=>DATA.team[+i][p][l],set:(l,v)=>{DATA.team[+i][p][l]=v;}};}
  if(key.startsWith("treat:")){const[,i,p]=key.split(":");
    return {get:l=>DATA.treatments[+i][p][l],set:(l,v)=>{DATA.treatments[+i][p][l]=v;}};}
  if(key.startsWith("faq:")){const[,i,p]=key.split(":");
    return {get:l=>((DATA.faq[+i][p])||{})[l]||"",
            set:(l,v)=>{if(!DATA.faq[+i][p])DATA.faq[+i][p]={el:"",en:""};DATA.faq[+i][p][l]=v;}};}
  if(key==="contact:address")
    return {get:l=>DATA.contact[l==="el"?"addressEl":"addressEn"],
            set:(l,v)=>{DATA.contact[l==="el"?"addressEl":"addressEn"]=v;}};
  return null;
}
function trControls(k){
  return `<div class="trbox">
    <button class="trbtn" data-pair="${esc(k)}" data-dir="el2en">EL&nbsp;→&nbsp;EN</button>
    <button class="trbtn" data-pair="${esc(k)}" data-dir="en2el">EN&nbsp;→&nbsp;EL</button></div>`;
}
function bindTr(){ $("#view").querySelectorAll(".trbtn").forEach(b=>b.onclick=()=>runTranslate(b)); }
async function runTranslate(btn){
  const pair=trPair(btn.dataset.pair); if(!pair) return;
  const dir=btn.dataset.dir, from=dir==="el2en"?"el":"en", to=dir==="el2en"?"en":"el";
  const src=pair.get(from);
  if(!src||!src.trim()){ flash(T("trEmptySrc")); return; }
  const old=btn.innerHTML; btn.textContent="…"; btn.disabled=true;
  try{
    const out=await translateText(src,from,to);
    pair.set(to,out); persist();
    const f=document.querySelector(`[data-pair-field="${btn.dataset.pair}"][data-l="${to}"]`);
    if(f) f.value=out;
    flash(T("trDone")(dir==="el2en"?"EL → EN":"EN → EL"));
  }catch(_){ flash(T("trFail")); }
  btn.innerHTML=old; btn.disabled=false;
}
async function translateGroupMissing(pairs,dir){
  const from=dir==="el2en"?"el":"en", to=dir==="el2en"?"en":"el";
  let done=0,failed=0; flash(T("trBusy"));
  for(const key of pairs){
    const pair=trPair(key); if(!pair) continue;
    const src=pair.get(from), dst=pair.get(to);
    if(!src||!src.trim()||(dst&&dst.trim())) continue;
    try{ pair.set(to,await translateText(src,from,to)); done++; }
    catch(_){ failed++; if(failed>2) break; }
    await new Promise(r=>setTimeout(r,320));
  }
  persist(); render(); flash(T("trBulk")(done,failed));
}

/* ---------- images ---------- */
function readImage(file,maxEdge,cb){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image();
    im.onload=()=>{ let w=im.width,h=im.height;
      const sc=Math.min(1,maxEdge/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      const png=/png$/i.test(file.type);
      cb(cv.toDataURL(png?"image/png":"image/jpeg",png?undefined:0.82)); };
    im.src=fr.result; };
  fr.readAsDataURL(file);
}

/* ---------- export / import / reset ---------- */
function doExport(){
  DATA.updated=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify(DATA,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="content.json"; a.click();
  URL.revokeObjectURL(a.href);
  dirty=false; $("#dirty").hidden=true; flash(T("exported"));
}
$("#exportBtn").onclick=doExport;
$("#exportBtn2").onclick=doExport;
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ DATA=JSON.parse(r.result); persist(); buildNav(); render(); flash(T("imported")); }
    catch(_){ alert(T("badJson")); } };
  r.readAsText(f);
};
$("#resetBtn").onclick=()=>{
  if(!confirm(T("confReset"))) return;
  localStorage.removeItem(LSKEY);
  DATA=JSON.parse(JSON.stringify(BASE));
  buildNav(); render(); setDirty(false,T("restored"));
};
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
